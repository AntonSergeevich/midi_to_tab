<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15161c">
<title>NASLUX — Студия</title>
<meta name="description" content="Песня с нуля по описанию и тексту, переделка вашего трека в другой стиль, разделение на партии — нейросетью.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="studio-page">
<div class="wrap wide">
  <header class="top">
    <a href="/" class="brand"><img src="/static/logo.svg" alt="" width="76" height="24"><span>NASLUX</span></a>
    <div style="display:flex;gap:14px;align-items:center">
      <a href="/studio" aria-current="page">Студия</a>
      <a href="/library">Мои треки</a>
      <a href="/pricing">Тарифы</a>
      <a href="/account" id="account" class="who">Вход</a>
      <a href="/pricing" id="balance" class="badge">загрузка…</a>
    </div>
  </header>

  <div class="studio-app">
    <!-- ЛЕВО: что сделать -->
    <aside class="st-panel" id="panel">
      <div class="st-tabs" id="modes" role="tablist">
        <button type="button" data-mode="create" class="on">Создать</button>
        <button type="button" data-mode="restyle">Переделать</button>
        <button type="button" data-mode="stems">Партии</button>
        <button type="button" data-mode="enrich">Дописать</button>
      </div>
      <p class="st-hint" id="modeHint"></p>

      <div class="st-drop" id="drop" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <div><b id="dropTitle">Загрузите трек</b><small id="dropHint">mp3, wav, flac, ogg, m4a · до 6 минут</small></div>
        <input type="file" id="file" hidden accept=".mp3,.wav,.flac,.ogg,.m4a,.aiff,.aif">
      </div>

      <label class="st-field" id="titleBox">
        <span>Название</span>
        <input type="text" id="title" maxlength="80" placeholder="например: С днём рождения, Саша">
      </label>

      <div id="styleBox">
        <div class="st-label">Стиль</div>
        <div class="presets" id="presets"></div>
        <input type="text" id="prompt" maxlength="500" class="st-input"
               placeholder="или своими словами: жанр, настроение, инструменты, голос">
      </div>

      <div id="trackBox" hidden>
        <label class="st-field"><span>Какую партию дописать</span><select id="track"></select></label>
      </div>

      <div id="lyricsBox">
        <div class="st-label st-labelrow">
          <span>Текст песни <em id="lyricsNote" class="muted"></em></span>
          <span class="st-tools">
            <button type="button" class="icon-btn" id="lyricsAi" title="Сочинить текст нейросетью">
              <svg viewBox="0 0 24 24"><path d="m12 3 1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3Zm6 11 .9 2.1 2.1.9-2.1.9L18 20l-.9-2.1L15 17l2.1-.9L18 14Z"/></svg>
              <span>Сочинить</span>
            </button>
            <button type="button" class="icon-btn" id="lyricsExpand" title="Развернуть на весь экран">
              <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
          </span>
        </div>
        <div class="st-ai" id="aiBox" hidden>
          <input type="text" id="aiPrompt" maxlength="500" class="st-input"
                 placeholder="о чём песня: поздравление маме с юбилеем, весело">
          <button type="button" class="primary" id="aiGo">Сочинить</button>
        </div>
        <div class="lyrics-wrap" id="lyricsWrap">
          <div class="lyrics-bar">
            <b>Текст песни</b>
            <span class="muted" id="lyricsCount"></span>
            <button type="button" class="primary" id="lyricsDone">Готово</button>
          </div>
          <textarea id="lyrics" rows="8" maxlength="5000"
                    placeholder="[Куплет]&#10;Первая строка&#10;Вторая строка&#10;&#10;[Припев]&#10;…"></textarea>
        </div>
        <label class="check" id="instrumentalBox"><input type="checkbox" id="instrumental"> Без слов — инструментал</label>
      </div>

      <div id="strengthBox" hidden>
        <div class="knobs">
          <label class="field knob"><span>Влияние песни <b id="audioVal"></b></span>
            <input type="range" id="audioKnob" min="0" max="100" value="50"></label>
          <label class="field knob"><span>Влияние стиля <b id="styleVal"></b></span>
            <input type="range" id="styleKnob" min="0" max="100" value="50"></label>
          <label class="field knob"><span>Странность <b id="weirdVal"></b></span>
            <input type="range" id="weirdKnob" min="0" max="100" value="30"></label>
          <label class="field knob"><span>Удержание мелодии <b id="melodyVal"></b></span>
            <input type="range" id="melodyKnob" min="0" max="100" value="0"></label>
        </div>
      </div>

      <div class="st-go">
        <button class="primary st-start" id="start" disabled>Создать</button>
        <p class="muted" id="msg"></p>
      </div>
    </aside>

    <!-- ПРАВО: треки и страница трека -->
    <section class="st-library">
      <div id="listView">
        <div class="st-libhead"><h2>Мои треки</h2><span class="muted" id="count"></span></div>
        <div id="jobs" class="st-list"><p class="muted">Здесь появятся ваши песни.</p></div>
      </div>
      <div id="detailView" hidden></div>
    </section>
  </div>
</div>

<!-- Плеер: один на страницу -- музыка не прерывается при обновлении списка -->
<div class="st-player" id="player" hidden>
  <button type="button" class="play-btn" id="playerToggle" aria-label="Пауза"></button>
  <div class="st-player-info"><b id="playerTitle"></b><small id="playerSub" class="muted"></small></div>
  <audio id="audio" controls preload="none"></audio>
</div>

<script src="/static/studio.js"></script>
<script src="/static/consent.js"></script>
</body>
</html>
