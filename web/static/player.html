<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MidiToTab — плеер</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">Midi<span>To</span>Tab</div>
    <div style="display:flex;gap:10px;align-items:center">
      <a href="/">← новая песня</a>
    </div>
  </header>

  <div style="display:flex;align-items:center;gap:20px;margin-bottom:16px;flex-wrap:wrap">
    <div class="big" id="nowChord">—</div>
    <div>
      <div id="title" style="font-size:17px;font-weight:600"></div>
      <div id="meta" class="muted"></div>
    </div>
  </div>

  <div class="stage">
    <div class="playhead"></div>
    <div class="lane" id="chordLane"><div class="track" id="chordTrack"></div></div>
    <div class="lane tab" id="tabLane">
      <div class="strings" id="stringLines"></div>
      <div class="track" id="tabTrack"></div>
    </div>
    <div class="controls">
      <button class="primary" id="play">▶ Играть</button>
      <span class="time" id="time">0:00 / 0:00</span>
      <input type="range" class="seek" id="seek" value="0" min="0" max="1000">
      <label class="field" style="width:120px;margin:0">
        <span>Скорость</span>
        <select id="rate">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="count" checked> Отсчёт вперёд</label>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>

  <div class="card" style="margin-top:18px">
    <h2>Файлы</h2>
    <div id="files" style="display:flex;gap:10px;flex-wrap:wrap"></div>
  </div>

  <div class="card">
    <h2>Отчёт</h2>
    <div id="summary" class="muted"></div>
  </div>

  <div class="card">
    <h2>Табулатура целиком</h2>
    <pre id="tabText" style="overflow-x:auto;font:13px/1.5 Consolas,monospace;color:var(--text)"></pre>
  </div>
</div>
<script src="/static/player.js"></script>
</body>
</html>
