[project]
name = "midi2tab"
version = "1.0.0"
description = "Перевод MIDI и аудио-стемов в гитарные табы (Guitar Pro 5 и текст)"
requires-python = ">=3.10"
dependencies = [
    "pretty-midi>=0.2.10",
    "PyGuitarPro>=0.10",
]

[project.optional-dependencies]
# Внимание: basic-pitch тянет tensorflow, которого нет под Python 3.13.
# Рабочая установка -- через requirements-audio.txt + pip install --no-deps basic-pitch.
audio = ["onnxruntime>=1.16", "librosa>=0.10", "mir_eval>=0.6", "resampy>=0.4", "soundfile>=0.12"]
dev = ["pytest>=7.0"]

[project.scripts]
midi2tab = "midi2tab.cli:main"

[project.gui-scripts]
midi2tab-gui = "midi2tab.gui:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
