name: Проверка naslux.ru

# Идёт с инфраструктуры GitHub, не из облачной сессии Claude -- у той
# исходящий доступ ограничен списком разрешённых доменов, и naslux.ru в
# него не входит (проверено на живой ошибке EGRESS_BLOCKED). Здесь такого
# ограничения нет: обычный внешний HTTPS-запрос.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      # Без токена: жив ли сайт и отвечает ли Студия. Даже если секрет
      # пропал из настроек, падение сайта отсюда будет видно.
      - name: Сайт и Студия отвечают
        run: |
          set -euo pipefail
          for path in / /studio /api/studio; do
            code="$(curl -sS -o /tmp/page -w '%{http_code}' "https://naslux.ru$path")"
            echo "$path -> HTTP $code"
            [ "$code" = 200 ] || { echo "::error::$path ответил HTTP $code"; exit 1; }
          done
          jq -c '{ready, why, services}' /tmp/page

      # Тем же кодом, что и сайт (web/studio.py): запросы к RunPod уже
      # падали на Cloudflare из-за User-Agent, а снаружи это видно не было.
      - uses: actions/checkout@v4
      - name: RunPod принимает запросы Студии
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 - <<'PY'
          from web import studio
          endpoint = studio.endpoint_id()
          print("эндпоинт", endpoint)
          print(studio.call("GET", f"{studio.RUNPOD_API}/{endpoint}/health"))
          PY

      - name: GET /api/health
        run: |
          set -euo pipefail

          if [ -z "${NASLUX_HEALTH_TOKEN:-}" ]; then
            echo "::error::Секрет NASLUX_HEALTH_TOKEN не задан в настройках репозитория"
            echo "  (Settings -> Secrets and variables -> Actions -> New repository secret)"
            exit 1
          fi

          response="$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer ${NASLUX_HEALTH_TOKEN}" \
            https://naslux.ru/api/health)"
          code="$(echo "$response" | tail -n1)"
          body="$(echo "$response" | sed '$d')"
          echo "$body" | jq .

          if [ "$code" != "200" ]; then
            echo "::error::/api/health ответил HTTP $code"
            exit 1
          fi

          # Кириллические ключи с пробелами jq не понимает через точку
          # (.оплата."готов принимать оплату" -- синтаксическая ошибка) --
          # только через индекс в квадратных скобках. Проверено на живом
          # прогоне: без этого шаг падал уже после успешного запроса.
          ready="$(echo "$body" | jq -r '.["оплата"]["готов принимать оплату"]')"
          if [ "$ready" != "true" ]; then
            echo "::error::Оплата не настроена: $(echo "$body" | jq -c '.["оплата"]')"
            exit 1
          fi

          total="$(echo "$body" | jq -r '.["уведомлений_за_последние"]')"
          rejected="$(echo "$body" | jq -r '.["из_них_отклонено"]')"
          echo "Отклонённых уведомлений: $rejected из $total (последние 20)"

          # Доехал ли последний пуш. Автодеплой уже молча не срабатывал
          # (вебхук отклонялся с 401), и сайт работал на старом коде --
          # снаружи этого видно не было. Деплой идёт около минуты, поэтому
          # при расхождении ждём и проверяем ещё раз, прежде чем падать.
          want="${GITHUB_SHA:0:7}"
          for attempt in 1 2 3 4; do
            have="$(curl -sS -H "Authorization: Bearer ${NASLUX_HEALTH_TOKEN}" \
              https://naslux.ru/api/health | jq -r '.["версия"]')"
            [ "$have" = "$want" ] && break
            [ "$attempt" -lt 4 ] && sleep 45
          done
          if [ "$have" != "$want" ]; then
            echo "::error::На сервере $have, а последний пуш $want -- автодеплой не сработал"
            exit 1
          fi
          echo "На сервере последний пуш: $have"
        env:
          NASLUX_HEALTH_TOKEN: ${{ secrets.NASLUX_HEALTH_TOKEN }}
