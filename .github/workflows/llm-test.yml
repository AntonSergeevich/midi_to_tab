name: Тексты песен через ИИ-шлюз Beget

# Проба качества: сочинить текст по описанию и дописать продолжение тем же
# кодом, что у сайта (web/llm.py). Описание -- своё, без чужих песен; итог --
# в аннотации (лог прогона из облачной сессии не скачать). Нужен секрет
# BEGET_AI_API_KEY; деньги -- с баланса Beget, доли рубля за прогон.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "О чём песня"
        default: "Песня про группу, которая репетирует в гараже зимой и мечтает о первом концерте, поп-рок, бодро"
      model:
        description: "Модель шлюза"
        default: "claude-opus-5.5"

jobs:
  lyrics:
    runs-on: ubuntu-latest
    env:
      BEGET_AI_API_KEY: ${{ secrets.BEGET_AI_API_KEY }}
      NASLUX_LLM_MODEL: ${{ inputs.model }}
      PROMPT: ${{ inputs.prompt }}
    steps:
      - uses: actions/checkout@v4
      - name: Устройство ответа шлюза (без ключа и без текста)
        run: |
          [ -n "$BEGET_AI_API_KEY" ] || { echo "::error::Секрет BEGET_AI_API_KEY не задан"; exit 1; }
          python3 - <<'PY'
          import json, os, urllib.request
          body = {"model": os.environ["NASLUX_LLM_MODEL"], "max_tokens": 300,
                  "messages": [{"role": "user", "content": "Напиши одну строку о весне."}]}
          req = urllib.request.Request("https://api-llm.beget.com/v1/chat/completions", method="POST",
              data=json.dumps(body).encode(), headers={"Authorization": "Bearer " + os.environ["BEGET_AI_API_KEY"],
              "Content-Type": "application/json", "User-Agent": "naslux/1.0"})
          raw = urllib.request.urlopen(req, timeout=120).read().decode()
          d = json.loads(raw)
          def shape(x, depth=0):
              if isinstance(x, dict): return {k: shape(v, depth + 1) for k, v in x.items()}
              if isinstance(x, list): return [shape(v, depth + 1) for v in x[:3]]
              if isinstance(x, str): return f"str[{len(x)}]"
              return x
          print("::notice title=Устройство ответа::" + json.dumps(shape(d), ensure_ascii=False)[:3000])
          msg = (d.get("choices") or [{}])[0].get("message") or {}
          print("::notice title=Пример ответа::" + json.dumps(msg, ensure_ascii=False)[:600])
          PY
      - name: Сочинить и продлить
        run: |
          [ -n "$BEGET_AI_API_KEY" ] || { echo "::error::Секрет BEGET_AI_API_KEY не задан"; exit 1; }
          python3 - <<'PY'
          import os, time
          from web import llm
          t = time.time()
          song = llm.write_lyrics(os.environ["PROMPT"])
          first = time.time() - t
          more = llm.extend_lyrics(song["lyrics"])
          one = lambda text: text.replace("\n", " | ")
          print(f"::notice title=Название ({llm.model()}, {first:.1f} с)::{song['title']}")
          print(f"::notice title=Текст::{one(song['lyrics'])}")
          print(f"::notice title=Продолжение::{one(more['lyrics'])}")
          PY
