name: Собрать образ замера ACE-Step (XL + планировщик)

# Образ ghcr.io/<владелец>/naslux-worker:acestep-test для RunPod Serverless
# (acestep_test/): поверх готового образа воркера -- тонкий слой, веса XL и
# планировщика качаются при старте воркера. Тег в пакете воркера, а не свой
# пакет: тот уже публичный (RunPod тянет без логина), новый был бы приватным.
on:
  workflow_dispatch:
  push:
    paths: ["acestep_test/**"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Освободить место
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Имя образа
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr A-Z a-z)/naslux-worker" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: acestep_test
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:acestep-test
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Образ публичный?
        run: |
          docker logout ghcr.io
          token=$(curl -s "https://ghcr.io/token?scope=repository:${IMAGE#ghcr.io/}:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/acestep-test")
          echo "Анонимный доступ к образу: HTTP $code"
          [ "$code" = 200 ] || echo "::warning::Образ приватный -- сделайте пакет naslux-worker публичным"
