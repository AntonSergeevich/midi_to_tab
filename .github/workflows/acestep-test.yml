name: Живой тест ACE-Step (RunPod)

# Идёт на серверах GitHub: у облачной сессии Claude доступ к api.runpod.ai
# закрыт политикой сети. Эндпоинт создаётся с workersMin=0 -- без запросов
# за GPU не платим. Результат -- mp3 в артефактах прогона.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Сколько секунд трека обработать
        default: "60"
      audio_url:
        description: Исходный трек (mp3)
        default: https://raw.githubusercontent.com/AntonSergeevich/vibe_track/claude/nu-metal-track-transformer-kf2j2n/we_angel.mp3

jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Зависимости и исходник
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests
          curl -sSfL "${{ inputs.audio_url }}" -o source.mp3
      - name: Эндпоинт ACE-Step (создать, если нет)
        run: python scripts/runpod_endpoint.py
      - name: Генерация
        run: python scripts/acestep_test.py source.mp3 --seconds "${{ inputs.seconds }}" --out acestep_cover.mp3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acestep-${{ github.run_number }}
          path: acestep_cover.mp3
          if-no-files-found: warn
