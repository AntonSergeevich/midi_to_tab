name: Диагностика naslux.ru (что именно не отвечает)

# Сайт завис (08.10): сервер не ответил за 10 минут. Отсюда видно звено:
# DNS -> TCP 443 -> TLS -> nginx (статика, вебхук) -> приложение (/, /api).
# Итог -- в аннотациях: логи задач из облачной сессии не читаются.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/site-diag.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Звенья
        run: |
          host=naslux.ru
          ip=$(getent ahostsv4 $host | awk 'NR==1{print $1}')
          echo "::notice title=DNS::$host -> ${ip:-не разрешился}"
          for port in 22 80 443; do
            if timeout 8 bash -c "</dev/tcp/$ip/$port" 2>/dev/null; then r=открыт; else r="нет ответа"; fi
            echo "::notice title=TCP $port::$r"
          done
          probe() {
            out=$(curl -sS -o /dev/null --max-time 25 -w '%{http_code} за %{time_total}с (tls %{time_appconnect}с, первый байт %{time_starttransfer}с)' "$@" 2>&1 || true)
            echo "::notice title=$1::$out"
          }
          probe https://$host/static/nav.js
          probe https://$host/robots.txt
          probe https://$host/
          probe https://$host/api/studio
          code=$(curl -sS -o /dev/null --max-time 25 -w '%{http_code}' -X POST -H 'X-GitHub-Event: ping' -d '{}' https://$host/internal/deploy-webhook 2>&1 || true)
          echo "::notice title=вебхук деплоя (отдельный процесс)::$code"
          # Push этого файла сам перезапускает сайт (автодеплой): ждём, когда поднимется
          for i in $(seq 1 30); do
            c=$(curl -sS -o /dev/null --max-time 15 -w '%{http_code}' https://$host/api/studio || true)
            [ "$c" = 200 ] && { echo "::notice title=сайт поднялся::через $((i * 10)) с, /api/studio -> 200"; exit 0; }
            sleep 10
          done
          echo "::error title=сайт не поднялся::5 минут: /api/studio -> $c"
          exit 1
