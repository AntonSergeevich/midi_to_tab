name: Себестоимость RunPod

# Только чтение: какие видеокарты у эндпоинтов и сколько они стоили по
# счёту RunPod за последние 30 дней. Ответы API -- в аннотации целиком
# (лог прогона из облачной сессии не скачать), ключ -- только из секретов.
on:
  workflow_dispatch: {}

jobs:
  cost:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Эндпоинты и счёт
        run: |
          set -uo pipefail
          api() { curl -sS -H "Authorization: Bearer $RUNPOD_API_KEY" "https://rest.runpod.io/v1$1"; }
          api /endpoints | jq -c '[.[] | {name, id, gpuTypeIds, gpuCount, workersMin, workersMax, idleTimeout, flashboot, allowedCudaVersions, networkVolumeId, dataCenterIds, templateId}]' > endpoints.json || true
          echo "::notice title=Эндпоинты::$(cat endpoints.json)"
          start="$(date -u -d '30 days ago' +%Y-%m-%dT00:00:00Z)"
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for id in $(jq -r '.[].id' endpoints.json); do
            name="$(jq -r --arg id "$id" '.[] | select(.id == $id) | .name' endpoints.json)"
            # очередь и видеокарты прямо сейчас: idle/running/throttled -- нет ли нехватки
            echo "$name $(jq -c --arg id "$id" '.[] | select(.id == $id) | {gpuTypeIds, workersMax, allowedCudaVersions, networkVolumeId, dataCenterIds, templateId}' endpoints.json) $(curl -sS -H "Authorization: Bearer $RUNPOD_API_KEY" "https://api.runpod.ai/v2/$id/health" | head -c 400)" >> health.txt
            bill="$(api "/billing/endpoints?endpointId=$id&bucketSize=month&startTime=$start&endTime=$end" | head -c 3000)"
            echo "::notice title=Счёт $name::$bill"
          done
          echo "::notice title=Очередь и видеокарты сейчас::$(tr '\n' '|' < health.txt)"
          # образы шаблонов: есть ли такой тег в реестре (нет -- воркер не поднимется)
          api /templates | jq -r '.[] | select(.isServerless) | "\(.name) \(.imageName)"' > templates.txt || true
          while read -r name image; do
            repo="${image%%:*}"; tag="${image##*:}"; [ "$repo" = "$image" ] && tag=latest
            path="${repo#ghcr.io/}"
            token=$(curl -s "https://ghcr.io/token?scope=repository:$path:pull" | jq -r .token)
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/$path/manifests/$tag")
            echo "$name $image -> $code" >> images.txt
          done < templates.txt
          echo "::notice title=Образы шаблонов::$(tr '\n' '|' < images.txt)"
          # воркеры naslux-worker: почему не поднимаются (статус, машина, последняя смена)
          wid=$(jq -r '.[] | select(.name | startswith("naslux-worker")) | .id' endpoints.json | head -1)
          api "/endpoints/$wid?includeWorkers=true&includeTemplate=true" | jq -c '{workers: [.workers[]? | {id, desiredStatus, lastStatusChange, machineId, gpuTypeId: (.machine.gpuTypeId // .gpuTypeId), costPerHr, lastStartedAt}], template: (.template | {imageName, containerDiskInGb, env: ((.env // {}) | keys)})}' > worker.json 2>&1 || true
          echo "::notice title=Воркеры naslux-worker::$(head -c 1800 worker.json)"
          echo "::notice title=Счёт всех эндпоинтов::$(api "/billing/endpoints?bucketSize=month&startTime=$start&endTime=$end&grouping=endpointId" | head -c 3000)"
