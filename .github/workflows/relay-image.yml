name: Ретранслятор Mureka на RunPod

# Образ relay/ (крошечный, без моделей) -> ghcr.io и CPU-эндпоинт
# (в уже публичный пакет naslux-worker под тегами relay-*: новый пакет
# GitHub создаёт приватным, и RunPod его бы не скачал)
# naslux-relay на RunPod с ключом Mureka в окружении шаблона.
on:
  workflow_dispatch:
  push:
    paths: ["relay/**"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      MUREKA_API_KEY: ${{ secrets.MUREKA_API_KEY || secrets.MUREKA_API_KEY2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: relay
          push: true
          provenance: false
          tags: ghcr.io/antonsergeevich/naslux-worker:relay,ghcr.io/antonsergeevich/naslux-worker:relay-${{ github.run_number }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Эндпоинт на RunPod
        run: |
          pip install -q requests
          RELAY_IMAGE="ghcr.io/antonsergeevich/naslux-worker:relay-${{ github.run_number }}" python scripts/runpod_relay.py
      - name: Проверка через ретранслятор
        run: python scripts/relay_check.py
