name: AAM — разведка набора

# Какие файлы лежат в AAM (zenodo 5794629, CC BY 4.0) и как устроены
# разметки аккордов: чтобы подключить его к обучению нейросети аккордов.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Список файлов
        run: |
          curl -sSfL https://zenodo.org/api/records/5794629 -o rec.json
          python3 - <<'PY'
          import json
          d = json.load(open("rec.json"))
          print(d["metadata"]["title"], "|", d["metadata"].get("license"))
          for f in d["files"]:
              print(f"{f['size']/1e6:10.1f} MB  {f['key']}")
          PY
      - name: Разметка -- первые файлы
        run: |
          python3 - <<'PY'
          import json, subprocess
          d = json.load(open("rec.json"))
          small = sorted(d["files"], key=lambda f: f["size"])
          for f in small[:3]:
              print("==", f["key"])
          ann = [f for f in d["files"] if "annot" in f["key"].lower() or "arff" in f["key"].lower()]
          pick = (ann or small)[0]
          print("качаю", pick["key"], pick["size"])
          subprocess.run(["curl", "-sSfL", pick["links"]["self"], "-o", "sample.bin"], check=True)
          PY
          file sample.bin
          (unzip -l sample.bin | head -40) || true
          mkdir s && (cd s && unzip -q ../sample.bin) || true
          f=$(find s -type f | grep -i chord | head -1); echo "== $f"; [ -n "$f" ] && head -60 "$f"
          f=$(find s -type f | head -1); echo "== $f"; head -40 "$f"
