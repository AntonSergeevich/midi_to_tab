name: Обложки на RunPod

# Образ cover/ (SDXL-Lightning + перевод ru->en) -> ghcr.io (в уже публичный
# пакет naslux-worker под тегами cover-*), эндпоинт naslux-cover на RunPod и
# пробные обложки в ветку test-results/covers-<номер прогона>.
on:
  workflow_dispatch:
  push:
    paths: ["cover/**"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Освободить место
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: cover
          push: true
          provenance: false
          tags: ghcr.io/antonsergeevich/naslux-worker:cover,ghcr.io/antonsergeevich/naslux-worker:cover-${{ github.run_number }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Эндпоинт на RunPod
        run: |
          pip install -q requests
          COVER_IMAGE="ghcr.io/antonsergeevich/naslux-worker:cover-${{ github.run_number }}" python scripts/runpod_cover.py
      - name: Пробные обложки
        timeout-minutes: 30
        run: python scripts/cover_check.py covers
      - name: В ветку test-results
        if: always()
        run: |
          [ -n "$(ls -A covers 2>/dev/null)" ] || exit 0
          dir="covers-${{ github.run_id }}"
          git clone -q --depth 1 --branch test-results \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out
          mkdir -p "out/$dir" && cp covers/* "out/$dir/"
          cd out
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "Обложки: прогон ${{ github.run_id }}"
          git push -q origin HEAD:test-results
