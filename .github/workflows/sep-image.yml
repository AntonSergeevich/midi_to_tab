name: Собрать образ замера разделения (BS-RoFormer)

# Тег naslux-worker:sep-test в уже публичном пакете воркера (sep_test/).
on:
  workflow_dispatch:
  push:
    paths: ["sep_test/**"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Освободить место
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: sep_test
          push: true
          provenance: false
          tags: ghcr.io/antonsergeevich/naslux-worker:sep-test,ghcr.io/antonsergeevich/naslux-worker:sep-test-${{ github.run_number }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
