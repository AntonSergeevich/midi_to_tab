name: Собрать образ GPU-воркера

# Образ ghcr.io/<владелец>/naslux-worker для RunPod Serverless (worker/).
# Веса моделей внутри образа -- ~20 ГБ, поэтому сначала освобождаем место
# на раннере: из коробки у него свободно ~14 ГБ.
on:
  workflow_dispatch:
  push:
    paths: ["worker/**"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Освободить место
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Имя образа
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr A-Z a-z)/naslux-worker" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: worker
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.run_number }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Итог
        run: |
          df -h /
          echo "Образ: $IMAGE:${{ github.run_number }}"
          # Проверка, что образ публичный: RunPod тянет его без логина.
          docker logout ghcr.io
          token=$(curl -s "https://ghcr.io/token?scope=repository:${IMAGE#ghcr.io/}:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/${{ github.run_number }}")
          echo "Анонимный доступ к образу: HTTP $code"
          [ "$code" = 200 ] || echo "::warning::Образ приватный -- сделайте пакет naslux-worker публичным"
