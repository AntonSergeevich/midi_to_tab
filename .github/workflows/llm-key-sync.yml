name: Ключи ИИ-шлюза и GenAPI -- на сервер

# Ключ Beget из секрета BEGET_AI_API_KEY -- на сайт (POST /api/health/llm-key
# с токеном проверки). Без ручной вставки в консоли сервера. В логах ключа
# нет: GitHub прячет секреты, ответ сайта -- только длина и признаки ключа.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      KEY: ${{ secrets.BEGET_AI_API_KEY }}
      GENAPI_KEY: ${{ secrets.GENAPI_API_KEY }}
      NASLUX_HEALTH_TOKEN: ${{ secrets.NASLUX_HEALTH_TOKEN }}
    steps:
      - name: Отправить ключ
        run: |
          [ -n "$KEY" ] || { echo "::error::Секрет BEGET_AI_API_KEY не задан"; exit 1; }
          body=$(jq -n --arg key "$KEY" '{key: ($key | gsub("^\\s+|\\s+$"; ""))}')
          out=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $(printf %s "$NASLUX_HEALTH_TOKEN" | tr -d '\r\n ')" \
            -H "Content-Type: application/json" --data-binary "$body" https://naslux.ru/api/health/llm-key)
          echo "::notice title=Ответ сайта::$(echo "$out" | tail -n1) $(echo "$out" | sed '$d' | head -c 300)"
      - name: Отправить ключ GenAPI (Suno)
        if: always()
        run: |
          [ -n "$GENAPI_KEY" ] || { echo "::warning::Секрет GENAPI_API_KEY не задан"; exit 0; }
          body=$(jq -n --arg key "$GENAPI_KEY" '{key: ($key | gsub("^\\s+|\\s+$"; ""))}')
          out=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $(printf %s "$NASLUX_HEALTH_TOKEN" | tr -d '\r\n ')" \
            -H "Content-Type: application/json" --data-binary "$body" https://naslux.ru/api/health/genapi-key)
          echo "::notice title=Ответ сайта (GenAPI)::$(echo "$out" | tail -n1) $(echo "$out" | sed '$d' | head -c 300)"
