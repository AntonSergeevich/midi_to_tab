# nginx для naslux.ru
# Ставится в /etc/nginx/sites-available/naslux и линкуется в sites-enabled.

# IPv6 намеренно не включён: если на сервере он выключен, строка
# listen [::]:80 роняет nginx целиком. Когда IPv6 есть, добавьте рядом
# с каждым listen строку "listen [::]:PORT ssl;" — и проверьте nginx -t.

upstream nasluh_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP: пропускаем только проверку сертификата, остальное на HTTPS
server {
    listen 80;
    server_name naslux.ru www.naslux.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://naslux.ru$request_uri;
    }
}

# Основной сервер
server {
    # Синтаксис "listen ... http2" работает во всех версиях; отдельная
    # директива "http2 on" появилась только в nginx 1.25.1, и на более
    # старых серверах конфиг с ней просто не запускается.
    listen 443 ssl http2;
    server_name naslux.ru;

    ssl_certificate     /etc/letsencrypt/live/naslux.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naslux.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Заголовки безопасности. HSTS включайте, только когда HTTPS уже
    # работает: он запрещает браузеру ходить по HTTP целый год.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Песни весят десятки мегабайт, а по умолчанию nginx режет тело
    # запроса на одном мегабайте -- без этой строки загрузка падает с 413.
    client_max_body_size 80m;
    client_body_timeout 300s;

    # Разбор идёт минутами: ответ придётся ждать дольше обычного.
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    access_log /var/log/nginx/nasluh.access.log;
    error_log  /var/log/nginx/nasluh.error.log;

    location /static/ {
        alias /opt/nasluh/app/web/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Автодеплой (опционально, см. install_deploy_webhook.sh). Слушатель
    # -- отдельный процесс на localhost:8099, не сам nasluh_app: если
    # служба вебхука не установлена, этот путь просто отвечает 502, на
    # остальной сайт это не влияет.
    location /internal/deploy-webhook {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://nasluh_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;   # чтобы ход обработки доходил сразу
    }
}

# www -> без www
server {
    listen 443 ssl;
    server_name www.naslux.ru;
    ssl_certificate     /etc/letsencrypt/live/naslux.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naslux.ru/privkey.pem;
    return 301 https://naslux.ru$request_uri;
}
